<!doctype html>
<html lang="en" class="scroll-smooth font-sans">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soul Space Creations | Bags & Thrifts</title>
  <meta name="description"
    content="Bags and Thrifting Shop and bespoke accessories. Handcrafted with traditional artisan techniques, contemporary luxury silhouettes, and African geometric identity." />
  <meta property="og:title" content="Soul Space Creations | Bags & Thrifts" />
  <meta property="og:description"
    content="Bags and Thrifting Shop and bespoke accessories. Handcrafted with traditional artisan techniques, contemporary luxury silhouettes, and African geometric identity." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Outfit:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --loader-bg: #270f44;
      --loader-bg-deep: #160728;
      --loader-bg-glow: #3d176b;
      --loader-gold: #d4af37;
      --loader-gold-light: #fff2b2;
      --loader-terracotta: #d95a2b;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      overflow: hidden;
      user-select: none;
      touch-action: manipulation;
      background: var(--loader-bg-deep);
    }

    /* Two curtain panels that slide open vertically when the site is loaded */
    #loader .panel {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50.5%;
      background: radial-gradient(circle at 50% 50%, var(--loader-bg-glow) 0%, var(--loader-bg) 50%, var(--loader-bg-deep) 100%);
      transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1) 0.25s;
      will-change: transform;
    }

    #loader .panel.top {
      top: 0;
    }

    #loader .panel.bottom {
      bottom: 0;
    }

    /* Central luxury stage */
    #loader .stage {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: clamp(14px, 3.2vw, 24px);
      transition: opacity 0.4s ease, transform 0.5s ease;
      cursor: pointer;
    }

    /* Floating subtle gold sparkles */
    #loader .dust {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    #loader .dust i {
      position: absolute;
      bottom: -10px;
      width: var(--s);
      height: var(--s);
      border-radius: 50%;
      background: var(--loader-gold);
      opacity: 0;
      box-shadow: 0 0 6px 1px rgba(212, 175, 55, 0.45);
      animation: loaderRise var(--d) linear var(--w) infinite;
    }

    /* Monogram emblem badge */
    #loader .emblem-wrap {
      position: relative;
      width: clamp(76px, 18vw, 104px);
      height: clamp(76px, 18vw, 104px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2px;
    }

    #loader .emblem-halo {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.25) 0%, transparent 70%);
      animation: loaderPulse 2.8s ease-in-out infinite;
    }

    #loader .emblem-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(212, 175, 55, 0.25);
      border-top-color: var(--loader-gold);
      border-right-color: var(--loader-gold-light);
      animation: loaderSpin 3.5s linear infinite;
    }

    #loader .emblem-ring-rev {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 1px dashed rgba(217, 90, 43, 0.4);
      animation: loaderSpinRev 6s linear infinite;
    }

    #loader .emblem-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(24px, 5.5vw, 34px);
      color: var(--loader-gold-light);
      letter-spacing: -0.04em;
      text-shadow: 0 2px 14px rgba(212, 175, 55, 0.6);
      transform: scale(0.95);
      animation: loaderBreathe 3s ease-in-out infinite;
    }

    #loader .emblem-inner span {
      color: var(--loader-terracotta);
      font-weight: 700;
      font-size: 0.85em;
      margin: 0 1px;
    }

    /* Brand Title & Tagline */
    #loader .brand-title {
      margin: 0;
      font-family: 'Syne', 'Outfit', sans-serif;
      font-size: clamp(17px, 4.4vw, 28px);
      font-weight: 800;
      letter-spacing: clamp(0.18em, 0.6vw, 0.3em);
      text-transform: uppercase;
      color: var(--loader-gold-light);
      text-align: center;
      text-shadow: 0 2px 18px rgba(212, 175, 55, 0.4);
      position: relative;
    }

    #loader .brand-tagline {
      margin: -6px 0 0;
      font-family: Georgia, 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(13px, 3.2vw, 17px);
      color: rgba(255, 242, 178, 0.82);
      letter-spacing: 0.1em;
      text-align: center;
    }

    /* Active Luxury Progress Track (Unmistakable loader behavior) */
    #loader .progress-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      width: 100%;
      max-width: 260px;
    }

    #loader .progress-track {
      width: 100%;
      height: 3px;
      background: rgba(212, 175, 55, 0.18);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    #loader .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--loader-terracotta), var(--loader-gold), var(--loader-gold-light));
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.85);
      transition: width 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    #loader .progress-bar::after {
      content: '';
      position: absolute;
      top: -2px;
      right: 0;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 8px 2px rgba(255, 242, 178, 0.95);
    }

    /* Animated status badge */
    #loader .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: 'Space Mono', monospace;
      font-size: clamp(10px, 2.4vw, 11px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 242, 178, 0.75);
    }

    #loader .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--loader-gold);
      box-shadow: 0 0 8px var(--loader-gold);
      animation: loaderPulse 1.4s ease-in-out infinite;
    }

    /* Skip / Quick Enter Button */
    #loader .skip-btn {
      position: absolute;
      bottom: max(18px, env(safe-area-inset-bottom, 18px));
      right: 18px;
      z-index: 10;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 242, 178, 0.85);
      background: rgba(39, 15, 68, 0.7);
      border: 1px solid rgba(212, 175, 55, 0.35);
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      -webkit-tap-highlight-color: transparent;
    }

    #loader .skip-btn:hover,
    #loader .skip-btn:active {
      color: #ffffff;
      border-color: var(--loader-gold);
      background: rgba(61, 23, 107, 0.85);
      transform: scale(1.03);
    }

    /* When loader finishes: stage fades out & curtain panels split open */
    #loader.done .stage {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    #loader.done .skip-btn {
      opacity: 0;
      pointer-events: none;
    }

    #loader.done .dust {
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    #loader.done .panel.top {
      transform: translateY(-101%);
    }

    #loader.done .panel.bottom {
      transform: translateY(101%);
    }

    /* Keyframe Animations */
    @keyframes loaderSpin {
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes loaderSpinRev {
      100% {
        transform: rotate(-360deg);
      }
    }

    @keyframes loaderPulse {

      0%,
      100% {
        opacity: 0.45;
        transform: scale(0.96);
      }

      50% {
        opacity: 1;
        transform: scale(1.06);
      }
    }

    @keyframes loaderBreathe {

      0%,
      100% {
        transform: scale(0.95);
      }

      50% {
        transform: scale(1.02);
      }
    }

    @keyframes loaderRise {
      0% {
        transform: translate(0, 0);
        opacity: 0;
      }

      15% {
        opacity: 0.6;
      }

      90% {
        opacity: 0.5;
      }

      100% {
        transform: translate(var(--x), -105vh);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      #loader .emblem-ring,
      #loader .emblem-ring-rev,
      #loader .dust i {
        animation: none !important;
      }

      #loader .panel {
        transition: opacity 0.5s ease !important;
      }

      #loader.done .panel.top,
      #loader.done .panel.bottom {
        transform: none !important;
        opacity: 0 !important;
      }
    }
  </style>

  <noscript>
    <style>
      #loader {
        display: none !important;
      }
    </style>
  </noscript>
</head>

<body class="bg-brand-cream text-brand-brown-text antialiased selection:bg-brand-terracotta selection:text-brand-cream">

  <!-- ===== LUXURY BRAND CURTAIN LOADER ===== -->
  <div id="loader" role="status" aria-live="polite" aria-label="Soul Space Creations, loading atelier">
    <div class="panel top"></div>
    <div class="panel bottom"></div>

    <!-- Ambient Gold Dust -->
    <div class="dust" aria-hidden="true">
      <i style="left:12%;--s:2px;--d:9s;--w:0.2s;--x:12px"></i>
      <i style="left:26%;--s:3px;--d:10s;--w:1.8s;--x:-10px"></i>
      <i style="left:44%;--s:2px;--d:8.5s;--w:0.5s;--x:15px"></i>
      <i style="left:58%;--s:3px;--d:11s;--w:2.1s;--x:-8px"></i>
      <i style="left:73%;--s:2px;--d:9.5s;--w:1.2s;--x:14px"></i>
      <i style="left:88%;--s:3px;--d:10.5s;--w:0.8s;--x:-12px"></i>
    </div>

    <!-- Active Loading Stage -->
    <div class="stage">
      <!-- Animated Monogram Emblem -->
      <div class="emblem-wrap">
        <div class="emblem-halo"></div>
        <div class="emblem-ring"></div>
        <div class="emblem-ring-rev"></div>
        <div class="emblem-inner">
          S<span>&</span>S
        </div>
      </div>

      <!-- Brand Typography -->
      <h1 class="brand-title">Soul Space Creations</h1>
      <p class="brand-tagline">Bags and thrifting shop</p>

      <!-- Active Progress Bar (Visible, responsive loading feedback on all phones) -->
      <div class="progress-box">
        <div class="progress-track">
          <div id="loader-bar" class="progress-bar"></div>
        </div>
        <div class="status-pill">
          <span class="status-dot"></span>
          <span id="loader-status">loading...</span>
        </div>
      </div>
    </div>

    <!-- Quick Dismiss / Skip Button -->
    <!-- <button id="loader-skip" class="skip-btn" type="button" aria-label="Enter Atelier immediately">
      Enter &rarr;
    </button> -->
  </div>

  <script>
    (function () {
      var loader = document.getElementById('loader');
      var bar = document.getElementById('loader-bar');
      var status = document.getElementById('loader-status');
      var skipBtn = document.getElementById('loader-skip');
      if (!loader) return;

      var dismissed = false;
      var progress = 12;

      // Realistic progress simulation that updates actively
      var progressTimer = setInterval(function () {
        if (dismissed) {
          clearInterval(progressTimer);
          return;
        }

        if (progress < 65) {
          progress += Math.floor(Math.random() * 12) + 8;
        } else if (progress < 88) {
          progress += Math.floor(Math.random() * 6) + 3;
          if (status) status.textContent = "Curating...";
        } else if (progress < 95) {
          progress += 2;
          if (status) status.textContent = "Designing...";
        }

        if (bar) bar.style.width = Math.min(progress, 96) + '%';
      }, 160);

      function hide() {
        if (dismissed) return;
        dismissed = true;
        clearInterval(progressTimer);

        if (bar) bar.style.width = '100%';
        if (status) status.textContent = "Welcome";

        // Brief smooth pause at 100% then split the curtain
        setTimeout(function () {
          loader.classList.add('done');
          setTimeout(function () {
            if (loader && loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 1100);
        }, 280);
      }

      // Tap / Click handlers
      if (skipBtn) {
        skipBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          hide();
        });
      }

      var stage = loader.querySelector('.stage');
      if (stage) {
        stage.addEventListener('click', hide);
      }

      // When the window is fully loaded (React + styles ready)
      if (document.readyState === 'complete') {
        setTimeout(hide, 1200);
      } else {
        window.addEventListener('load', function () {
          // Allow minimum 1.6s so the mobile visitor clearly sees the luxury entrance
          setTimeout(hide, 1400);
        });
      }

      // Safety timeout: never block mobile user longer than 3.6s
      setTimeout(hide, 3600);
    })();
  </script>
  <!-- ===== END LOADER ===== -->

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
